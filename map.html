<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>London Coffee Chain Gap Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { height: 100%; width: 100%; }
  .panel {
    position: absolute; top: 12px; right: 12px; z-index: 1000;
    background: white; padding: 14px 16px; border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2); font-size: 14px; width: 230px;
  }
  .panel h3 { margin: 0 0 10px 0; font-size: 15px; }
  .panel label { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; }
  .panel .row { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .starbucks-swatch { background: #00704A; }
  .costa-swatch { background: #6C1F45; }
  .panel input[type=range] { width: 100%; }
  #status { position: absolute; bottom: 12px; left: 12px; z-index: 1000; background: white; padding: 6px 10px; border-radius: 6px; font-size: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.15); }
</style>
</head>
<body>

<div id="map"></div>
<div class="panel">
  <h3>London Coffee Gap Map</h3>
  <label><input type="checkbox" id="toggleStarbucks" checked> <span class="swatch starbucks-swatch"></span> Starbucks</label>
  <label><input type="checkbox" id="toggleCosta" checked> <span class="swatch costa-swatch"></span> Costa Coffee</label>
  <div class="row"><span>Radius (m)</span><span id="radiusVal">300</span></div>
  <input type="range" id="radiusSlider" min="100" max="800" step="50" value="300">
  <p style="font-size:12px; color:#555; margin-top:10px;">
    Blank areas inside London with no overlapping circles = potential gaps.
    Click any marker for its address.
  </p>
</div>
<div id="status">Loading store data…</div>

<script>
const map = L.map('map').setView([51.505, -0.14], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let starbucksLayer = L.layerGroup().addTo(map);
let costaLayer = L.layerGroup().addTo(map);
let currentRadius = 300;

function addStores(stores, layerGroup, color, brandLabel) {
  layerGroup.clearLayers();
  stores.forEach(store => {
    if (store.lat == null || store.lng == null) return;
    const marker = L.circleMarker([store.lat, store.lng], {
      radius: 4, color: color, fillColor: color, fillOpacity: 0.9, weight: 1
    }).bindPopup(`<b>${brandLabel}</b><br>${store.name || ''}<br>${store.address || ''}`);
    const coverage = L.circle([store.lat, store.lng], {
      radius: currentRadius, color: color, fillColor: color,
      fillOpacity: 0.06, weight: 0, interactive: false
    });
    marker.addTo(layerGroup);
    coverage.addTo(layerGroup);
    marker._coverageCircle = coverage;
  });
}

function updateRadius(newRadius) {
  currentRadius = newRadius;
  document.getElementById('radiusVal').textContent = newRadius;
  addStores(window._starbucksData || [], starbucksLayer, '#00704A', 'Starbucks');
  addStores(window._costaData || [], costaLayer, '#6C1F45', 'Costa Coffee');
}

document.getElementById('radiusSlider').addEventListener('input', (e) => {
  updateRadius(parseInt(e.target.value));
});
document.getElementById('toggleStarbucks').addEventListener('change', (e) => {
  if (e.target.checked) map.addLayer(starbucksLayer); else map.removeLayer(starbucksLayer);
});
document.getElementById('toggleCosta').addEventListener('change', (e) => {
  if (e.target.checked) map.addLayer(costaLayer); else map.removeLayer(costaLayer);
});

async function loadData() {
  const status = document.getElementById('status');
  try {
    const [sbResp, costaResp] = await Promise.all([
      fetch('stores_starbucks.json'),
      fetch('stores_costa.json')
    ]);
    if (!sbResp.ok || !costaResp.ok) throw new Error('Could not fetch store files');
    window._starbucksData = await sbResp.json();
    window._costaData = await costaResp.json();

    updateRadius(currentRadius);

    const all = [...window._starbucksData, ...window._costaData].filter(s => s.lat && s.lng);
    if (all.length) {
      const bounds = L.latLngBounds(all.map(s => [s.lat, s.lng]));
      map.fitBounds(bounds, { padding: [30, 30] });
    }
    status.textContent = `${window._starbucksData.length} Starbucks · ${window._costaData.length} Costa`;
  } catch (err) {
    status.textContent = 'Error loading store data — see console';
    console.error(err);
  }
}

loadData();
</script>

</body>
</html>
